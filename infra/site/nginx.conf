# Pages are never stored: browsers reuse a stored page without asking on back/forward and when
# restoring tabs at launch, even with no-cache, so a deploy wouldn't show until a hard refresh.
# Other files (the model, images outside _assets/) are stored but checked every time.
map $sent_http_content_type $page_cache {
  ~^text/html "no-store";
  default "no-cache";
}

# Update checks (/appcast.xml, below). The app's Sparkle sends "Netnyahoo/<version> Sparkle/<x>" as its
# User-Agent, and "first=1" on a copy's first check. Those two and the day (sent as the event's timestamp)
# are all that's passed on: no IP, no other header, no cookie.
map $http_user_agent $update_version {
  "~^Netnyahoo/([0-9][0-9A-Za-z.-]{0,31}) Sparkle/" $1;
  default "";
}
map $arg_first $update_first {
  "1" true;
  default false;
}
map $time_iso8601 $update_day {
  "~^([0-9]{4}-[0-9]{2}-[0-9]{2})T" "$1T00:00:00Z";
}
# nginx has no escape for "$" in a string; PostHog's own property names start with one.
geo $dollar {
  default "$";
}

# Telemetry (infra/telemetry, docs/growth.md "Telemetry"). The client's address comes from Fly's edge;
# it's used for rate limits here and handed to the collector once, which turns it into a country.
limit_req_zone $http_fly_client_ip zone=otel:10m rate=20r/s;
limit_req_zone $http_fly_client_ip zone=replay:10m rate=5r/s;
limit_req_zone $http_fly_client_ip zone=reader:1m rate=5r/s;
limit_req_status 429;
# Who may use /_ch/: the "reader" or "importer" user by header (X-ClickHouse-User, the Mac scripts), or
# "reader" by Basic auth (hekuto, through Composio's ClickHouse connection). Regexes, since map's plain strings
# ignore case. Only the reader's Basic credentials are passed on; nobody else's ever reach ClickHouse.
map "$http_x_clickhouse_user:$remote_user" $ch_auth_ok {
  "~^(reader|importer):$" 1;
  "~^:reader$" 1;
  default 0;
}
map $remote_user $ch_authorization {
  "~^reader$" $http_authorization;
  default "";
}
# Replay chunks are filed under the day they arrive (UTC).
map $time_iso8601 $replay_day {
  "~^([0-9]{4}-[0-9]{2}-[0-9]{2})T" "$1";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # Behind the platform's TLS proxy: redirects (/release-notes → /release-notes/) must stay
  # relative, or they point at http://…:8080.
  absolute_redirect off;

  # Every request arrives through the platform's proxy (with a Via header), and nginx's default is not to
  # compress those, which left it to the proxy's quick, larger gzip or brotli. The build writes a best-level
  # .gz beside each text file and the model (apps/site/astro.config.mjs); anything else is gzipped here.
  gzip on;
  gzip_static on;
  gzip_proxied any;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml model/gltf-binary;

  # Astro fingerprints everything under _assets/.
  location /_assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Big Yahu (1.4 MB). The page asks for big-yahu.<content hash>.glb (apps/site/astro.config.mjs), which is
  # cached for good; the plain name is checked like other files. A page from before a deploy may ask for the
  # previous hash: it gets the current model under the plain name's rules, so nothing caches it under the old
  # name. mime.types doesn't know .glb.
  location /models/ {
    types { model/gltf-binary glb; }
    etag off;
    if_modified_since off;
    add_header Last-Modified "";
    add_header Cache-Control "no-cache";

    location ~ "^/models/big-yahu\.[0-9a-f]{10}\.glb$" {
      add_header Last-Modified "";
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri /models/big-yahu.glb;
    }
  }

  # PostHog through our own domain, so ad blockers don't drop the site's analytics (they block
  # posthog.com, not netnyahoo.com). Hostnames go through variables so nginx resolves them per
  # request with the container's resolver: a DNS hiccup at boot can't keep the site from starting.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
  # Check PostHog's certificate: the relay serves the SDK script the page runs.
  proxy_ssl_verify on;
  proxy_ssl_verify_depth 3;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  location ^~ /relay/static/ {
    set $ph_assets eu-assets.i.posthog.com;
    rewrite ^/relay/(.*)$ /$1 break;
    proxy_pass https://$ph_assets;
    proxy_set_header Host $ph_assets;
    proxy_ssl_server_name on;
    proxy_ssl_name $ph_assets;
  }
  location ^~ /relay/array/ {
    set $ph_assets eu-assets.i.posthog.com;
    rewrite ^/relay/(.*)$ /$1 break;
    proxy_pass https://$ph_assets;
    proxy_set_header Host $ph_assets;
    proxy_ssl_server_name on;
    proxy_ssl_name $ph_assets;
  }
  location ^~ /relay/ {
    set $ph_api eu.i.posthog.com;
    rewrite ^/relay/(.*)$ /$1 break;
    proxy_pass https://$ph_api;
    proxy_set_header Host $ph_api;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_ssl_server_name on;
    proxy_ssl_name $ph_api;
    client_max_body_size 20m;
  }

  # --- Telemetry --------------------------------------------------------------------------------
  # The services are private, reached by their Hexclave hostnames (IPv6 only, hence ipv6=on here).
  # Analytics events and logs, OTLP/HTTP (JSON or protobuf): logs only, no traces or metrics.
  location = /otel/v1/logs {
    limit_except POST { deny all; }
    limit_req zone=otel burst=60 nodelay;
    client_max_body_size 512k;
    # Kept in memory: nginx's 16k default wrote most batches and replay chunks to disk first.
    client_body_buffer_size 512k;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=on;
    set $otel ${TELEMETRY_COLLECTOR_HOST};
    proxy_pass http://$otel:4318/v1/logs;
    proxy_pass_request_headers off;
    proxy_set_header Content-Type $content_type;
    proxy_set_header Content-Encoding $http_content_encoding;
    proxy_set_header X-Real-IP $http_fly_client_ip;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }

  # Session replay chunks (rrweb), written to SeaweedFS as replays/<day>/<session>/<seq>.json[.gz].
  location ~ "^/otel/replay/(?<replay_session>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/(?<replay_seq>[0-9]{1,6})\.(?<replay_ext>json|json\.gz)$" {
    limit_except POST PUT { deny all; }
    limit_req zone=replay burst=20 nodelay;
    client_max_body_size 2m;
    client_body_buffer_size 2m;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=on;
    set $objects ${TELEMETRY_OBJECTS_HOST};
    proxy_method PUT;
    proxy_pass http://$objects:8888/buckets/replays/$replay_day/$replay_session/$replay_seq.$replay_ext;
    proxy_pass_request_headers off;
    proxy_set_header Content-Type application/octet-stream;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }
  # Nothing else under /otel/ (a plain prefix, so the replay regex above still wins).
  location /otel/ {
    return 404;
  }

  # Read access for the owner's stats: ClickHouse's HTTP interface, for the read-only "reader" user
  # (and "importer", which can only add to telemetry.posthog_events). ClickHouse checks the password.
  # Header auth names either user; Basic auth only the reader ($ch_auth_ok above); URL credentials none.
  # The bare /_ch is ClickHouse's root too: nginx would answer it with a 301, which clients follow as a GET
  # without the body, losing a POSTed query (Composio's ClickHouse tools post to the base URL as given).
  location = /_ch {
    rewrite ^ /_ch/ last;
  }
  location ^~ /_ch/ {
    limit_except GET POST { deny all; }
    limit_req zone=reader burst=20;
    if ($ch_auth_ok = 0) { return 403; }
    if ($arg_user) { return 403; }
    if ($arg_password) { return 403; }
    client_max_body_size 64m;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=on;
    set $ch ${TELEMETRY_CLICKHOUSE_HOST};
    rewrite ^/_ch/(.*)$ /$1 break;
    proxy_pass http://$ch:8123;
    proxy_set_header Host $ch;
    proxy_set_header Authorization $ch_authorization;
    proxy_set_header Cookie "";
    proxy_read_timeout 300s;
    proxy_request_buffering off;
  }

  # Replays, read-only, with the token in ~/.config/netnyahoo/telemetry.env (scripts/replay.mjs).
  location ^~ /_replays/ {
    limit_except GET { deny all; }
    limit_req zone=reader burst=40;
    if ($http_authorization != "Bearer ${TELEMETRY_REPLAYS_READ_TOKEN}") { return 401; }
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=on;
    set $objects ${TELEMETRY_OBJECTS_HOST};
    rewrite ^/_replays/(.*)$ /buckets/replays/$1 break;
    proxy_pass http://$objects:8888;
    proxy_pass_request_headers off;
    proxy_set_header Accept $http_accept;
  }

  # The Sparkle feed (the app's SUFeedURL). It always answers with a redirect to the latest release's
  # appcast on GitHub, whatever happens to the count: the mirror below runs beside the request, its
  # result is thrown away, and GitHub isn't contacted from here. (A plain `return 302` would skip the
  # mirror, which runs after nginx's rewrite phase, so the redirect comes from error_page: the empty
  # root makes the file a 404.)
  location = /appcast.xml {
    mirror /_update_check;
    mirror_request_body off;
    root /var/empty;
    log_not_found off;
    add_header Cache-Control "no-store" always;
    error_page 404 =302 https://github.com/mantrakp04/netnyahoo/releases/latest/download/appcast.xml;
  }

  # One `update_check` event per update check (docs/growth.md, Installs): version, first check or not,
  # and the day as the timestamp, posted to the telemetry collector. The request's headers aren't passed
  # on (no address, so no country either), and a fixed distinct_id. Anything that isn't the app's
  # Sparkle isn't counted.
  location = /_update_check {
    internal;
    if ($request_method != GET) { return 204; }
    if ($update_version = "") { return 204; }
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=on;
    set $otel ${TELEMETRY_COLLECTOR_HOST};
    proxy_pass http://$otel:4318/v1/logs;
    proxy_method POST;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Content-Type application/json;
    proxy_set_body '{"resourceLogs":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"netnyahoo-feed"}}]},"scopeLogs":[{"scope":{"name":"netnyahoo.analytics"},"logRecords":[{"severityNumber":9,"body":{"stringValue":"update_check"},"attributes":[{"key":"event","value":{"stringValue":"update_check"}},{"key":"uuid","value":{"stringValue":"$request_id"}},{"key":"distinct_id","value":{"stringValue":"update-check"}},{"key":"timestamp","value":{"stringValue":"$update_day"}},{"key":"version","value":{"stringValue":"$update_version"}},{"key":"first","value":{"boolValue":$update_first}},{"key":"${dollar}lib","value":{"stringValue":"netnyahoo-feed"}}]}]}]}]}';
    proxy_connect_timeout 2s;
    proxy_send_timeout 2s;
    proxy_read_timeout 2s;
  }

  location / {
    # The deploy image gives every file the same mtime (1970), so Last-Modified and nginx's
    # mtime-based ETag never change: browsers revalidated and got 304 for a new deploy's pages.
    etag off;
    if_modified_since off;
    add_header Last-Modified "";
    add_header Cache-Control $page_cache;
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
  # The not-found page is a page: never stored (add_header skips error responses without `always`).
  location = /404.html {
    internal;
    etag off;
    if_modified_since off;
    add_header Last-Modified "" always;
    add_header Cache-Control "no-store" always;
  }
}
