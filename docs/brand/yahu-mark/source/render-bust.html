<!doctype html><html><head><style>html,body{margin:0;background:transparent}</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/examples/jsm/":"./three/examples/jsm/"}}</script></head><body>
<script type="module">
window.__done=false;
import * as T from "three";
import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/examples/jsm/libs/meshopt_decoder.module.js";
import { RoomEnvironment } from "three/examples/jsm/environments/RoomEnvironment.js";
try{
const P=Object.fromEntries(new URLSearchParams(location.search));
const num=(k,d)=>P[k]!==undefined?+P[k]:d;
const renderer=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.outputColorSpace=T.SRGBColorSpace; renderer.toneMapping=T.NeutralToneMapping; renderer.toneMappingExposure=num("exp",1.0);
renderer.setClearColor(0x000000,0);
const scene=new T.Scene();
const pm=new T.PMREMGenerator(renderer); scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture; scene.environmentIntensity=num("env",0.75);
const hemi=new T.HemisphereLight(0xffffff,0x3a3a3a,num("hemi",0.9)); scene.add(hemi);
const key=new T.DirectionalLight(0xfffaf2,num("key",2.2)); key.position.set(-1.4,2.6,3.2); scene.add(key);
const fill=new T.DirectionalLight(0xf2f5ff,num("fill",0.6)); fill.position.set(2.0,0.8,2.4); scene.add(fill);
const rimL=new T.DirectionalLight(0xffffff,num("rim",1.2)); rimL.position.set(-2.4,1.6,-2.0); scene.add(rimL);
const rimR=new T.DirectionalLight(0xffffff,num("rim",1.2)); rimR.position.set(2.4,1.6,-2.0); scene.add(rimR);
const g=await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync("./big-yahu.glb");
g.scene.traverse(o=>{if(o.isSkinnedMesh)o.frustumCulled=false});
const mixer=new T.AnimationMixer(g.scene);
const clip=g.animations.find(c=>c.name==="Default Dance");
const a=mixer.clipAction(clip); a.play(); mixer.setTime(num("t",0));
g.scene.updateMatrixWorld(true); g.scene.traverse(o=>o.isSkinnedMesh&&o.skeleton.update());
const box=new T.Box3().setFromObject(g.scene,true); const s=1/box.getSize(new T.Vector3()).y;
g.scene.scale.setScalar(s); g.scene.position.set(-((box.min.x+box.max.x)/2)*s,-box.min.y*s,-((box.min.z+box.max.z)/2)*s);
const root=new T.Group(); root.add(g.scene); scene.add(root);
const out={}; const b2=new T.Box3().setFromObject(g.scene,true); const mats=[]; g.scene.traverse(o=>{if(o.isMesh)mats.push(o.name+":"+(o.material.name||"")+":"+(o.material.map?"map":"nomap"))}); window.__info=JSON.stringify(mats);
function shot(name,{px=1152,top=1.02,bottom=0.46,cx=0,yaw=0.1,pitch=0,basic=false,albedo=false}={}){
  const h=top-bottom, w=h;
  renderer.setSize(px,px,false);
  const fov=8, cy=(top+bottom)/2, d=(h/2)/Math.tan(fov*Math.PI/360);
  const cam=new T.PerspectiveCamera(fov,1,0.1,100);
  cam.position.set(cx,cy,d); cam.lookAt(cx,cy,0);
  // tilt via rotating the model instead of the camera, so the frame stays in model units
  root.rotation.set(pitch,yaw,0);
  let saved=[];
  if(basic||albedo){ g.scene.traverse(o=>{if(o.isMesh){saved.push([o,o.material]);o.material=new T.MeshBasicMaterial(albedo?{map:o.material.map,color:o.material.color}:{color:0xffffff});}}); }
  const tm=renderer.toneMapping; if(albedo) renderer.toneMapping=T.NoToneMapping;
  renderer.render(scene,cam);
  out[name]=renderer.domElement.toDataURL("image/png");
  for(const [o,m] of saved) o.material=m; renderer.toneMapping=tm;
}
const top=num("top",1.02), bottom=num("bottom",0.46), yaw=num("yaw",0.1);
const list=JSON.parse(P.shots||"[]");
for(const sh of list) shot(sh.name,sh);
window.__out=out;
}catch(e){window.__err=String(e.stack||e)}
window.__done=true;
</script></body></html>
