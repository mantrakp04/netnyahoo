# Pages are never stored: browsers reuse a stored page without asking on back/forward and when
# restoring tabs at launch, even with no-cache, so a deploy wouldn't show until a hard refresh.
# Other files (the model, images outside _assets/) are stored but checked every time.
map $sent_http_content_type $page_cache {
  ~^text/html "no-store";
  default "no-cache";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # Behind the platform's TLS proxy: redirects (/release-notes → /release-notes/) must stay
  # relative, or they point at http://…:8080.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;

  # Astro fingerprints everything under _assets/.
  location /_assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # PostHog through our own domain, so ad blockers don't drop the site's analytics (they block
  # posthog.com, not netnyahoo.com). Hostnames go through variables so nginx resolves them per
  # request with the container's resolver: a DNS hiccup at boot can't keep the site from starting.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
  location ^~ /relay/static/ {
    set $ph_assets eu-assets.i.posthog.com;
    rewrite ^/relay/(.*)$ /$1 break;
    proxy_pass https://$ph_assets;
    proxy_set_header Host $ph_assets;
    proxy_ssl_server_name on;
    proxy_ssl_name $ph_assets;
  }
  location ^~ /relay/ {
    set $ph_api eu.i.posthog.com;
    rewrite ^/relay/(.*)$ /$1 break;
    proxy_pass https://$ph_api;
    proxy_set_header Host $ph_api;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_ssl_server_name on;
    proxy_ssl_name $ph_api;
    client_max_body_size 20m;
  }

  location / {
    # The deploy image gives every file the same mtime (1970), so Last-Modified and nginx's
    # mtime-based ETag never change: browsers revalidated and got 304 for a new deploy's pages.
    etag off;
    if_modified_since off;
    add_header Last-Modified "";
    add_header Cache-Control $page_cache;
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
}
