server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # Behind the platform's TLS proxy: redirects (/release-notes → /release-notes/) must stay
  # relative, or they point at http://…:8080.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;

  # Astro fingerprints everything under _assets/.
  location /_assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
}
