server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # Behind the platform's TLS proxy: redirects (/release-notes → /release-notes/) must stay
  # relative, or they point at http://…:8080.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;

  # Astro fingerprints everything under _assets/.
  location /_assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    # The deploy image gives every file the same mtime (1970), so Last-Modified and nginx's
    # mtime-based ETag never change: browsers revalidated and got 304 for a new deploy's pages.
    etag off;
    if_modified_since off;
    add_header Last-Modified "";
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
}
