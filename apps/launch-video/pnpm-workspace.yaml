# The launch video is its own workspace (excluded from the repo root's, which hoists for React Native),
# so installing it never touches the app's node_modules.
packages:
  - .
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@remotion/bundler@4.0.529'
  - '@remotion/canvas@4.0.529'
  - '@remotion/captions@4.0.529'
  - '@remotion/cli@4.0.529'
  - '@remotion/codemods@4.0.529'
  - '@remotion/compositor-darwin-arm64@4.0.529'
  - '@remotion/compositor-darwin-x64@4.0.529'
  - '@remotion/compositor-linux-arm64-gnu@4.0.529'
  - '@remotion/compositor-linux-arm64-musl@4.0.529'
  - '@remotion/compositor-linux-x64-gnu@4.0.529'
  - '@remotion/compositor-linux-x64-musl@4.0.529'
  - '@remotion/compositor-win32-x64-msvc@4.0.529'
  - '@remotion/licensing@4.0.529'
  - '@remotion/media-parser@4.0.529'
  - '@remotion/media-utils@4.0.529'
  - '@remotion/media@4.0.529'
  - '@remotion/paths@4.0.529'
  - '@remotion/player@4.0.529'
  - '@remotion/renderer@4.0.529'
  - '@remotion/streaming@4.0.529'
  - '@remotion/studio-protocol@4.0.529'
  - '@remotion/studio-server@4.0.529'
  - '@remotion/studio-shared@4.0.529'
  - '@remotion/studio@4.0.529'
  - '@remotion/timeline-utils@4.0.529'
  - '@remotion/web-renderer@4.0.529'
  - '@remotion/zod-types@4.0.529'
  - remotion@4.0.529
  - '@remotion/fonts@4.0.529'
