<!doctype html><html><head><style>html,body{margin:0;background:transparent}svg,div{display:block}</style></head><body>
<script>
window.__done=false;
const HEAD="M58 4C66 4 72 7 74 12L73.5 14.5C80 14 86 18 87.5 25C88.5 31 87 36 86.5 39C90 36.5 97 37 98.5 42C100 50 97 62 92 68.5C90.5 70.5 89 71 88.5 72C90 79 87 87 80 90.5C70 95.5 58 97 46 97C32 96.5 18 94 12 89C9 85 9.5 78 11.5 72C8 70 5 64 3.5 56C1.5 47 2 40 6 38.5C9 37.5 12 38 13.5 40C11 34 11.5 26 14 21C18 15 28 12 38 9.5C45 7 51 4 58 4Z";
const HAIRLINE=(new URLSearchParams(location.search)).get("hl")||"M18 44C22 31 34 24 50 23C61 22.5 70 23 78 28";
const BROWS=((new URLSearchParams(location.search)).get("br")||"M26 50Q37 52.5 45.5 59.5M72 43Q62 48.5 55 58.5")+((new URLSearchParams(location.search)).get("mouth")==="1"?"M38 80Q52 85 66 76":"");
const EYES=[[35.5,62],[61,60.5]];
function icon(size,{gap,brow,eyes=0,color="#fff",op=1}){
  const u=100/size;
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100"><defs><mask id="m${size}${gap}${brow}" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
    <path d="${HEAD}" fill="#fff"/>
    <path d="${HAIRLINE}" fill="none" stroke="#000" stroke-width="${gap*u}" stroke-linecap="round"/>
    <path d="${BROWS}" fill="none" stroke="#000" stroke-width="${brow*u}" stroke-linecap="round"/>
    ${eyes?EYES.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="${eyes*u/2}" fill="#000"/>`).join(""):""}
  </mask></defs><rect width="100" height="100" fill="${color}" fill-opacity="${op}" mask="url(#m${size}${gap}${brow})"/></svg>`;
}
window.icon=icon;
const P=Object.fromEntries(new URLSearchParams(location.search));
if(P.mode==="sheet"){
  // comparison sheet: sizes x backgrounds, drawn at 1:1 then the sheet is screenshotted at dpr
  document.body.innerHTML=`<div style="display:flex;gap:0">${["#2B2224","#F4EDEE"].map(bg=>`<div style="background:${bg};padding:10px;display:flex;gap:14px;align-items:center">
    ${[16,24,32].map(s=>`<div style="width:${s}px;height:${s}px">${icon(s,{gap:+P.gap,brow:+P.brow,eyes:+P.eyes||0,color:bg[1]==="2"?"#fff":"#000",op:bg[1]==="2"?.28:.3})}</div>`).join("")}
    ${[16,24,32].map(s=>`<div style="width:${s}px;height:${s}px">${icon(s,{gap:+P.gap,brow:+P.brow,eyes:+P.eyes||0,color:bg[1]==="2"?"#fff":"#000",op:1})}</div>`).join("")}
  </div>`).join("")}</div>`;
} else {
  const s=+P.size||48;
  document.body.innerHTML=`<div style="width:${s}px;height:${s}px;background:${P.bg||"transparent"}">${icon(s,{gap:+P.gap||1,brow:+P.brow||1.3,eyes:+P.eyes||0,color:P.color||"#fff"})}</div>`;
}
window.__done=true;
</script></body></html>
